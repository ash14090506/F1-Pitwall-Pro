version: "3.9"
services:
  backend:
    build: ./backend
    ports: ["8001:8001"]
    volumes: ["./backend/cache:/app/cache"]
    environment:
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/f1-strategist

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    volumes: ["n8n_data:/home/node/.n8n"]

volumes:
  n8n_data:
